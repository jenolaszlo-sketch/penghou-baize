name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build Penghou.Baize.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Baize.slnx --verify-no-changes --no-restore

      - name: Test and coverage (core)
        run: >
          dotnet test tests/Penghou.Baize.Tests/Penghou.Baize.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=40
          /p:ThresholdType=line

      - name: Test and coverage (Claude)
        run: >
          dotnet test tests/Penghou.Baize.Client.Claude.Tests/Penghou.Baize.Client.Claude.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-claude/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (OpenAI)
        run: >
          dotnet test tests/Penghou.Baize.Client.OpenAi.Tests/Penghou.Baize.Client.OpenAi.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-openai/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (Ollama)
        run: >
          dotnet test tests/Penghou.Baize.Client.Ollama.Tests/Penghou.Baize.Client.Ollama.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-ollama/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (Gemini)
        run: >
          dotnet test tests/Penghou.Baize.Client.Gemini.Tests/Penghou.Baize.Client.Gemini.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-gemini/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (Router)
        run: >
          dotnet test tests/Penghou.Baize.Router.Tests/Penghou.Baize.Router.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-router/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Router]*'
          /p:Threshold=80
          /p:ThresholdType=line

      - name: Test and coverage (Batch)
        run: >
          dotnet test tests/Penghou.Baize.Batch.Tests/Penghou.Baize.Batch.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-batch/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (Tools)
        run: >
          dotnet test tests/Penghou.Baize.Tools.Tests/Penghou.Baize.Tools.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-tools/
          /p:CoverletOutputFormat=cobertura

      - name: Test and coverage (Extensions.AI)
        run: >
          dotnet test tests/Penghou.Baize.Extensions.AI.Tests/Penghou.Baize.Extensions.AI.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-extensions-ai/
          /p:CoverletOutputFormat=cobertura

      - name: Validate packages
        run: dotnet pack Penghou.Baize.slnx --configuration Release --no-build --output artifacts

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-claude/
            coverage-openai/
            coverage-ollama/
            coverage-gemini/
            coverage-router/
            coverage-batch/
            coverage-tools/
            coverage-extensions-ai/
          if-no-files-found: error
