name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build Penghou.Baize.slnx --configuration Release

      - name: Verify exact transport packages and independent dependency closure
        shell: pwsh
        run: ./eng/verify-transport-dependencies.ps1

      - name: Verify formatting
        run: dotnet format Penghou.Baize.slnx --verify-no-changes --no-restore

      - name: Test and coverage (core)
        run: >
          dotnet test tests/Penghou.Baize.Tests/Penghou.Baize.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize]*'
          /p:Threshold=80
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Claude)
        run: >
          dotnet test tests/Penghou.Baize.Client.Claude.Tests/Penghou.Baize.Client.Claude.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-claude/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Claude]*'
          /p:Threshold=69
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (OpenAI)
        run: >
          dotnet test tests/Penghou.Baize.Client.OpenAi.Tests/Penghou.Baize.Client.OpenAi.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-openai/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.OpenAi]*'
          /p:Threshold=74
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Ollama)
        run: >
          dotnet test tests/Penghou.Baize.Client.Ollama.Tests/Penghou.Baize.Client.Ollama.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-ollama/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Ollama]*'
          /p:Threshold=77
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Gemini)
        run: >
          dotnet test tests/Penghou.Baize.Client.Gemini.Tests/Penghou.Baize.Client.Gemini.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-gemini/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Gemini]*'
          /p:Threshold=65
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Runway)
        run: >
          dotnet test tests/Penghou.Baize.Client.Runway.Tests/Penghou.Baize.Client.Runway.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-runway/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Runway]*'
          /p:Threshold=86
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Fal)
        run: >
          dotnet test tests/Penghou.Baize.Client.Fal.Tests/Penghou.Baize.Client.Fal.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-fal/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Fal]*'
          /p:Threshold=90
          /p:ThresholdType=line%2cbranch


      - name: Test and coverage (Router)
        run: >
          dotnet test tests/Penghou.Baize.Router.Tests/Penghou.Baize.Router.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-router/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Router]*'
          /p:Threshold=72
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Batch)
        run: >
          dotnet test tests/Penghou.Baize.Batch.Tests/Penghou.Baize.Batch.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-batch/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Batch]*'
          /p:Threshold=70
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Tools)
        run: >
          dotnet test tests/Penghou.Baize.Tools.Tests/Penghou.Baize.Tools.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-tools/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Tools]*'
          /p:Threshold=65
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Extensions.AI)
        run: >
          dotnet test tests/Penghou.Baize.Extensions.AI.Tests/Penghou.Baize.Extensions.AI.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-extensions-ai/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Extensions.AI]*'
          /p:Threshold=83
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Diagnostics)
        run: >
          dotnet test tests/Penghou.Baize.Diagnostics.Tests/Penghou.Baize.Diagnostics.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-diagnostics/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Baize.Diagnostics]*'
          /p:Threshold=65
          /p:ThresholdType=line%2cbranch

      - name: Validate packages
        run: dotnet pack Penghou.Baize.slnx --configuration Release --no-build --output artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-claude/
            coverage-openai/
            coverage-ollama/
            coverage-gemini/
            coverage-runway/
            coverage-fal/
            coverage-router/
            coverage-batch/
            coverage-tools/
            coverage-extensions-ai/
            coverage-diagnostics/
          if-no-files-found: error

  reviewed-offline-qualification:
    name: Reviewed offline qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Keep the historical Stage 4A contract on its reviewed runtime without
      # constraining the current-runtime build and transport jobs.
      - name: Install reviewed .NET SDK from verified archive
        shell: pwsh
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/baize-reviewed-dotnet
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'The reviewed SDK archive requires an x64 runner.' }
          if (Test-Path -LiteralPath $env:DOTNET_INSTALL_DIR) { throw 'The reviewed SDK install directory must be absent.' }
          $version = '10.0.401'
          # Pin the SHA-512 values from Microsoft's .NET 10 release metadata.
          if ($IsWindows) {
            $archiveName = "dotnet-sdk-$version-win-x64.zip"
            $sha512 = '24b670ad3d923bfcf47df6c3b034152398b42f6dbc388e10d783aee1cfb5e5817d399fc0ae2a12cfa822a55e61d34830ccb15c50ef6efee437ab874bb7c79430'
          } else {
            $archiveName = "dotnet-sdk-$version-linux-x64.tar.gz"
            $sha512 = '51c8b999af9e8dd9998c9edc5944e19a90788862068acd38694e098889054ce8c23d4f0c5cccfa16bf187d044562359e5ee69a9f8ad0bbe913ba90311fbce25b'
          }
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/Sdk/$version/$archiveName" -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash -ne $sha512) {
            throw 'The downloaded .NET SDK does not match the published SHA-512.'
          }

          $null = New-Item -ItemType Directory -Path $env:DOTNET_INSTALL_DIR
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $env:DOTNET_INSTALL_DIR
          } else {
            & tar -xzf $archive -C $env:DOTNET_INSTALL_DIR
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the reviewed .NET SDK archive.' }
          }

      - name: Test qualification contracts on the reviewed runtime (offline)
        shell: pwsh
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/baize-reviewed-dotnet
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'The offline qualification job requires an x64 runner.' }
          $dotnet = Join-Path $env:DOTNET_INSTALL_DIR 'dotnet'
          if ($IsWindows) { $dotnet += '.exe' }

          $runtime = @(& $dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.NETCore\.App 10\.' })
          if ($LASTEXITCODE -ne 0 -or $runtime.Count -ne 1 -or $runtime[0] -notmatch '^Microsoft\.NETCore\.App 10\.0\.12 \[') {
            throw 'Expected .NET 10.0.12 as the only installed .NET 10 runtime in the isolated toolchain.'
          }
          Write-Host $runtime[0]

          if ($IsWindows) {
            $httpPath = Join-Path $env:DOTNET_INSTALL_DIR 'shared/Microsoft.NETCore.App/10.0.12/System.Net.Http.dll'
            $httpHash = (Get-FileHash -LiteralPath $httpPath -Algorithm SHA256).Hash
            # The frozen Stage 4A physical-attempt audit reviewed this Windows x64 assembly.
            if ($httpHash -ne 'b98ed0cb80dd54c33fc049f33af5448710752155bbd5cc8cbcd932e01f066801') {
              throw 'The Windows System.Net.Http assembly does not match the frozen Stage 4A review.'
            }
          }

          $env:DOTNET_ROOT = $env:DOTNET_INSTALL_DIR
          $env:DOTNET_ROOT_X64 = $env:DOTNET_INSTALL_DIR
          $env:PATH = "$env:DOTNET_INSTALL_DIR$([IO.Path]::PathSeparator)$env:PATH"
          & $dotnet test tests/Penghou.Baize.Qualification.Tests/Penghou.Baize.Qualification.Tests.csproj --configuration Release
          exit $LASTEXITCODE

  transport-adoption:
    name: Transport adoption (${{ matrix.os }}, ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build package and adoption fixtures
        run: dotnet build Penghou.Baize.slnx --configuration Release
      - name: Verify published package dependency closure
        shell: pwsh
        run: ./eng/verify-transport-dependencies.ps1
      - name: Model and HTTP adoption qualification
        run: dotnet test tests/Penghou.Baize.Tests/Penghou.Baize.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --filter "FullyQualifiedName~ModelTransport|FullyQualifiedName~HttpTransportAdoption|FullyQualifiedName~HttpTransportLifecycle|FullyQualifiedName~HttpTransportFailure|FullyQualifiedName~ModelPayloadProfile"
      - name: Admission, routing and credential ordering qualification
        run: dotnet test tests/Penghou.Baize.Router.Tests/Penghou.Baize.Router.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --filter FullyQualifiedName~RoutedModelTransport
      - name: Extensions.AI context qualification
        run: dotnet test tests/Penghou.Baize.Extensions.AI.Tests/Penghou.Baize.Extensions.AI.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --filter FullyQualifiedName~TransportContext
      - name: Fresh package-only transport consumer
        shell: pwsh
        run: ./eng/qualify-transport-consumer.ps1 -Framework ${{ matrix.framework }}
